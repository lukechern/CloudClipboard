<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>表单验证测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            line-height: 1.6;
        }

        .test-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .test-form {
            background: white;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            background: #667eea;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background: #5a6fd8;
        }

        .hidden {
            display: none !important;
        }

        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }

        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>

<body>
    <h1>表单验证测试</h1>

    <div class="test-section">
        <h3>问题重现</h3>
        <p>当textarea有required属性但被隐藏时，表单提交会报错：</p>
        <code>"An invalid form control with name='content' is not focusable."</code>
    </div>

    <div class="test-form">
        <h3>测试表单</h3>
        <form id="testForm">
            <div class="form-group">
                <label for="testTextarea">文本内容 (必填)</label>
                <textarea id="testTextarea" name="content" required placeholder="这是一个必填的textarea"></textarea>
            </div>

            <div class="form-group">
                <button type="button" id="hideTextarea">隐藏textarea (保留required)</button>
                <button type="button" id="hideAndRemoveRequired">隐藏textarea (移除required)</button>
                <button type="button" id="showTextarea">显示textarea</button>
            </div>

            <div class="form-group">
                <button type="submit">提交表单</button>
            </div>
        </form>

        <div id="status"></div>
    </div>

    <div class="test-section">
        <h3>测试步骤</h3>
        <ol>
            <li>点击"隐藏textarea (保留required)" - 然后提交表单，会看到错误</li>
            <li>点击"隐藏textarea (移除required)" - 然后提交表单，不会报错</li>
            <li>点击"显示textarea" - 恢复正常状态</li>
        </ol>
    </div>

    <script>
        const form = document.getElementById('testForm');
        const textarea = document.getElementById('testTextarea');
        const status = document.getElementById('status');

        // 隐藏textarea但保留required属性
        document.getElementById('hideTextarea').addEventListener('click', () => {
            textarea.style.display = 'none';
            showStatus('textarea已隐藏，required属性保留', 'error');
        });

        // 隐藏textarea并移除required属性
        document.getElementById('hideAndRemoveRequired').addEventListener('click', () => {
            textarea.style.display = 'none';
            textarea.removeAttribute('required');
            showStatus('textarea已隐藏，required属性已移除', 'success');
        });

        // 显示textarea
        document.getElementById('showTextarea').addEventListener('click', () => {
            textarea.style.display = 'block';
            textarea.setAttribute('required', '');
            showStatus('textarea已显示，required属性已恢复', 'success');
        });

        // 表单提交处理
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            showStatus('表单提交成功！没有验证错误。', 'success');
        });

        function showStatus(message, type) {
            status.innerHTML = `<div class="status ${type}">${message}</div>`;
        }
    </script>
</body>

</html>
