<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebView诊断工具</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/records.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/mobile-optimized.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 10px auto;
            padding: 15px;
            font-size: 14px;
        }
        .diagnostic-section {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .diagnostic-section h3 {
            margin-top: 0;
            color: #495057;
        }
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin: 10px 0;
        }
        .info-item {
            background: white;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #dee2e6;
        }
        .info-label {
            font-weight: bold;
            color: #6c757d;
            font-size: 12px;
        }
        .info-value {
            color: #495057;
            font-family: monospace;
            font-size: 11px;
            word-break: break-all;
        }
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .status-good { background: #28a745; }
        .status-warning { background: #ffc107; }
        .status-error { background: #dc3545; }
        .test-button {
            background: #007bff;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
            font-size: 12px;
        }
        .test-button:hover {
            background: #0056b3;
        }
        .performance-meter {
            background: #e9ecef;
            height: 20px;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }
        .performance-bar {
            height: 100%;
            background: linear-gradient(90deg, #28a745, #ffc107, #dc3545);
            transition: width 0.3s ease;
        }
        .log-output {
            background: #212529;
            color: #f8f9fa;
            padding: 10px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 11px;
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <h1>🔍 WebView诊断工具</h1>
    <p>专门用于诊断安卓WebView中的图片加载问题</p>

    <!-- 设备检测 -->
    <div class="diagnostic-section">
        <h3>📱 设备检测</h3>
        <div class="info-grid" id="deviceInfo">
            <!-- 设备信息将通过JavaScript填充 -->
        </div>
    </div>

    <!-- 性能状态 -->
    <div class="diagnostic-section">
        <h3>⚡ 性能状态</h3>
        <div id="performanceStatus">
            <!-- 性能信息将通过JavaScript填充 -->
        </div>
    </div>

    <!-- 优化建议 -->
    <div class="diagnostic-section">
        <h3>💡 优化建议</h3>
        <div id="optimizationSuggestions">
            <!-- 优化建议将通过JavaScript填充 -->
        </div>
    </div>

    <!-- 功能测试 -->
    <div class="diagnostic-section">
        <h3>🧪 功能测试</h3>
        <div>
            <button class="test-button" onclick="testImageLoading()">测试图片加载</button>
            <button class="test-button" onclick="testMemoryUsage()">检查内存使用</button>
            <button class="test-button" onclick="testRenderPerformance()">测试渲染性能</button>
            <button class="test-button" onclick="simulateHeavyLoad()">模拟重负载</button>
        </div>
        <div id="testResults" style="margin-top: 15px;">
            <!-- 测试结果将显示在这里 -->
        </div>
    </div>

    <!-- 实时日志 -->
    <div class="diagnostic-section">
        <h3>📋 实时日志</h3>
        <div class="log-output" id="logOutput">等待日志输出...</div>
        <button class="test-button" onclick="clearLog()">清空日志</button>
    </div>

    <!-- 模拟记录测试 -->
    <div class="diagnostic-section">
        <h3>📄 记录渲染测试</h3>
        <div>
            <button class="test-button" onclick="loadLightRecords()">轻量记录</button>
            <button class="test-button" onclick="loadHeavyRecords()">重负载记录</button>
            <button class="test-button" onclick="clearRecords()">清空记录</button>
        </div>
        <div id="records-container" style="margin-top: 15px;">
            <!-- 测试记录将显示在这里 -->
        </div>
    </div>

    <script src="js/webview-detector.js"></script>
    <script src="js/content-mobile-optimized.js"></script>
    <script>
        let logBuffer = [];
        
        // 重写console.log以捕获日志
        const originalLog = console.log;
        console.log = function(...args) {
            originalLog.apply(console, args);
            logToOutput(args.join(' '));
        };

        function logToOutput(message) {
            const timestamp = new Date().toLocaleTimeString();
            logBuffer.push(`[${timestamp}] ${message}`);
            if (logBuffer.length > 50) {
                logBuffer.shift();
            }
            updateLogDisplay();
        }

        function updateLogDisplay() {
            const logOutput = document.getElementById('logOutput');
            logOutput.textContent = logBuffer.join('\n');
            logOutput.scrollTop = logOutput.scrollHeight;
        }

        function clearLog() {
            logBuffer = [];
            updateLogDisplay();
        }

        // 显示设备信息
        function showDeviceInfo() {
            const container = document.getElementById('deviceInfo');
            const ua = navigator.userAgent;
            const optimizer = window.webViewOptimizer;
            
            const deviceInfo = [
                { label: '用户代理', value: ua },
                { label: '是否移动设备', value: optimizer ? optimizer.isMobile : '未知' },
                { label: '是否安卓WebView', value: optimizer ? optimizer.isAndroidWebView : '未知' },
                { label: '性能模式', value: optimizer ? optimizer.performanceMode : '未知' },
                { label: '屏幕尺寸', value: `${window.innerWidth} x ${window.innerHeight}` },
                { label: '设备像素比', value: window.devicePixelRatio || 1 },
                { label: '可用内存', value: navigator.deviceMemory ? `${navigator.deviceMemory}GB` : '未知' },
                { label: 'CPU核心数', value: navigator.hardwareConcurrency || '未知' }
            ];

            container.innerHTML = deviceInfo.map(item => `
                <div class="info-item">
                    <div class="info-label">${item.label}</div>
                    <div class="info-value">${item.value}</div>
                </div>
            `).join('');
        }

        // 显示性能状态
        function showPerformanceStatus() {
            const container = document.getElementById('performanceStatus');
            const optimizer = window.webViewOptimizer;
            
            let memoryInfo = '不可用';
            let memoryUsage = 0;
            
            if ('memory' in performance) {
                const mem = performance.memory;
                const used = Math.round(mem.usedJSHeapSize / 1024 / 1024);
                const total = Math.round(mem.totalJSHeapSize / 1024 / 1024);
                const limit = Math.round(mem.jsHeapSizeLimit / 1024 / 1024);
                memoryInfo = `${used}MB / ${total}MB (限制: ${limit}MB)`;
                memoryUsage = (used / limit) * 100;
            }

            const connectionInfo = navigator.connection ? 
                `${navigator.connection.effectiveType} (${navigator.connection.downlink}Mbps)` : 
                '不可用';

            container.innerHTML = `
                <div class="info-grid">
                    <div class="info-item">
                        <div class="info-label">内存使用</div>
                        <div class="info-value">${memoryInfo}</div>
                        <div class="performance-meter">
                            <div class="performance-bar" style="width: ${memoryUsage}%"></div>
                        </div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">网络连接</div>
                        <div class="info-value">${connectionInfo}</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">最大图片数</div>
                        <div class="info-value">${optimizer ? optimizer.getMaxImagesPerRecord() : '未知'}</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">使用占位符</div>
                        <div class="info-value">${optimizer ? optimizer.shouldUsePlaceholders() : '未知'}</div>
                    </div>
                </div>
            `;
        }

        // 显示优化建议
        function showOptimizationSuggestions() {
            const container = document.getElementById('optimizationSuggestions');
            const optimizer = window.webViewOptimizer;
            
            let suggestions = [];
            
            if (optimizer && optimizer.isAndroidWebView) {
                suggestions.push({
                    status: 'good',
                    text: '✅ 已启用WebView优化模式'
                });
                suggestions.push({
                    status: 'good',
                    text: '✅ 使用图片占位符减少内存占用'
                });
                suggestions.push({
                    status: 'warning',
                    text: '⚠️ 建议限制同时显示的图片数量'
                });
            } else if (optimizer && optimizer.isMobile) {
                suggestions.push({
                    status: 'good',
                    text: '✅ 已启用移动端优化'
                });
                suggestions.push({
                    status: 'warning',
                    text: '⚠️ 可以考虑启用图片懒加载'
                });
            } else {
                suggestions.push({
                    status: 'good',
                    text: '✅ 桌面端性能良好'
                });
            }

            if ('memory' in performance) {
                const mem = performance.memory;
                const usagePercent = (mem.usedJSHeapSize / mem.jsHeapSizeLimit) * 100;
                if (usagePercent > 70) {
                    suggestions.push({
                        status: 'error',
                        text: '🚨 内存使用率过高，建议清理或刷新页面'
                    });
                }
            }

            container.innerHTML = suggestions.map(s => `
                <div style="margin: 8px 0;">
                    <span class="status-indicator status-${s.status}"></span>
                    ${s.text}
                </div>
            `).join('');
        }

        // 测试图片加载
        function testImageLoading() {
            logToOutput('开始测试图片加载...');
            const startTime = performance.now();
            
            const testImage = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==';
            const img = new Image();
            
            img.onload = () => {
                const loadTime = performance.now() - startTime;
                logToOutput(`图片加载成功，耗时: ${loadTime.toFixed(2)}ms`);
                updateTestResults('图片加载测试', '通过', `${loadTime.toFixed(2)}ms`);
            };
            
            img.onerror = () => {
                logToOutput('图片加载失败');
                updateTestResults('图片加载测试', '失败', '错误');
            };
            
            img.src = testImage;
        }

        // 检查内存使用
        function testMemoryUsage() {
            logToOutput('检查内存使用情况...');
            
            if ('memory' in performance) {
                const mem = performance.memory;
                const used = Math.round(mem.usedJSHeapSize / 1024 / 1024);
                const total = Math.round(mem.totalJSHeapSize / 1024 / 1024);
                const limit = Math.round(mem.jsHeapSizeLimit / 1024 / 1024);
                
                logToOutput(`内存使用: ${used}MB / ${total}MB (限制: ${limit}MB)`);
                
                const usagePercent = (used / limit) * 100;
                const status = usagePercent > 70 ? '警告' : '正常';
                updateTestResults('内存使用检查', status, `${usagePercent.toFixed(1)}%`);
            } else {
                logToOutput('无法获取内存信息');
                updateTestResults('内存使用检查', '不支持', 'N/A');
            }
        }

        // 测试渲染性能
        function testRenderPerformance() {
            logToOutput('测试渲染性能...');
            const startTime = performance.now();
            
            // 创建测试元素
            const testContainer = document.createElement('div');
            testContainer.style.position = 'absolute';
            testContainer.style.left = '-9999px';
            
            for (let i = 0; i < 100; i++) {
                const div = document.createElement('div');
                div.textContent = `测试元素 ${i}`;
                testContainer.appendChild(div);
            }
            
            document.body.appendChild(testContainer);
            
            // 强制重绘
            testContainer.offsetHeight;
            
            const renderTime = performance.now() - startTime;
            document.body.removeChild(testContainer);
            
            logToOutput(`渲染100个元素耗时: ${renderTime.toFixed(2)}ms`);
            
            const status = renderTime > 50 ? '慢' : '正常';
            updateTestResults('渲染性能测试', status, `${renderTime.toFixed(2)}ms`);
        }

        // 模拟重负载
        function simulateHeavyLoad() {
            logToOutput('模拟重负载测试...');
            const startTime = performance.now();
            
            // 创建大量DOM元素
            const container = document.getElementById('records-container');
            container.innerHTML = '';
            
            for (let i = 0; i < 50; i++) {
                const record = document.createElement('div');
                record.className = 'record-item';
                record.innerHTML = `
                    <div class="record-content">
                        测试记录 ${i + 1} - 这是一个用于测试性能的长文本内容，包含多行文字和复杂的HTML结构。
                        <div class="record-images">
                            <div class="record-image-placeholder">
                                <div class="image-placeholder-content">
                                    <div class="image-icon">🖼️</div>
                                    <div class="image-info">图片 1</div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(record);
            }
            
            const loadTime = performance.now() - startTime;
            logToOutput(`创建50个记录耗时: ${loadTime.toFixed(2)}ms`);
            
            const status = loadTime > 200 ? '慢' : '正常';
            updateTestResults('重负载测试', status, `${loadTime.toFixed(2)}ms`);
        }

        // 加载轻量记录
        function loadLightRecords() {
            const mockData = [
                { id: 1, content: '轻量测试记录 1', images: null, timestamp: '2024-12-25 14:30:00', length: 20 },
                { id: 2, content: '轻量测试记录 2', images: null, timestamp: '2024-12-25 14:25:00', length: 25 }
            ];
            
            if (typeof window.renderRecordsOptimized === 'function') {
                window.renderRecordsOptimized(mockData);
                logToOutput('已加载轻量记录');
            }
        }

        // 加载重负载记录
        function loadHeavyRecords() {
            const mockImage = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==';
            const mockData = [
                {
                    id: 1,
                    content: '[图片内容] 5张图片',
                    images: JSON.stringify(Array(5).fill().map((_, i) => ({
                        base64: mockImage,
                        type: 'image/png',
                        size: 1024 * (i + 1)
                    }))),
                    timestamp: '2024-12-25 14:30:00',
                    length: 150
                }
            ];
            
            if (typeof window.renderRecordsOptimized === 'function') {
                window.renderRecordsOptimized(mockData);
                logToOutput('已加载重负载记录');
            }
        }

        // 清空记录
        function clearRecords() {
            document.getElementById('records-container').innerHTML = '';
            logToOutput('已清空记录');
        }

        // 更新测试结果
        function updateTestResults(testName, status, value) {
            const container = document.getElementById('testResults');
            const resultDiv = document.createElement('div');
            resultDiv.style.margin = '5px 0';
            resultDiv.innerHTML = `
                <strong>${testName}:</strong> 
                <span style="color: ${status === '通过' || status === '正常' ? 'green' : status === '警告' ? 'orange' : 'red'}">
                    ${status}
                </span> 
                (${value})
            `;
            container.appendChild(resultDiv);
        }

        // 页面加载时初始化
        window.addEventListener('load', () => {
            setTimeout(() => {
                showDeviceInfo();
                showPerformanceStatus();
                showOptimizationSuggestions();
                logToOutput('诊断工具初始化完成');
                
                // 定期更新性能状态
                setInterval(() => {
                    showPerformanceStatus();
                }, 5000);
            }, 500);
        });

        // 模拟viewImage函数
        window.viewImage = function(base64, type) {
            logToOutput(`查看图片: ${type}, 大小: ${Math.round(base64.length * 0.75)} bytes`);
        };
    </script>
</body>
</html>
