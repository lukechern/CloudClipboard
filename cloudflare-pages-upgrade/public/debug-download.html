<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>下载按钮调试</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/records.css">
    <link rel="stylesheet" href="css/components.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
        }
        .debug-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .debug-info {
            background: #e9ecef;
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>下载按钮调试页面</h1>
    
    <div class="debug-section">
        <h3>测试不同的记录格式</h3>
        <div id="test-records"></div>
    </div>

    <div class="debug-section">
        <h3>调试信息</h3>
        <div id="debug-info"></div>
    </div>

    <script src="js/content.js"></script>
    <script>
        // 模拟不同格式的记录数据
        const testRecords = [
            {
                id: 1,
                content: '[图片内容] 1张图片',
                images: JSON.stringify([{
                    base64: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==',
                    type: 'image/png'
                }]),
                timestamp: '2024-12-25 14:30:00',
                length: 120
            },
            {
                id: 2,
                content: '[图片内容] 2张图片',
                images: JSON.stringify([
                    {
                        base64: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==',
                        type: 'image/png'
                    },
                    {
                        base64: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==',
                        type: 'image/png'
                    }
                ]),
                timestamp: '2024-12-25 14:25:00',
                length: 150
            },
            {
                id: 3,
                content: '普通文本内容',
                images: null,
                timestamp: '2024-12-25 14:20:00',
                length: 25
            },
            {
                id: 4,
                content: '混合内容：文本和图片',
                images: JSON.stringify([{
                    base64: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==',
                    type: 'image/png'
                }]),
                timestamp: '2024-12-25 14:15:00',
                length: 85
            }
        ];

        function renderTestRecords() {
            const container = document.getElementById('test-records');
            const debugInfo = document.getElementById('debug-info');
            let recordsHTML = '<ul class="record-list">';
            let debugHTML = '';

            testRecords.forEach(record => {
                // 复制主页面的逻辑
                const trimmedContent = record.content ? record.content.trim() : '';
                
                // 处理图片数据
                let imagesHTML = '';
                let hasImages = false;
                let images = [];
                if (record.images) {
                    try {
                        images = typeof record.images === 'string' ? JSON.parse(record.images) : record.images;
                        if (Array.isArray(images) && images.length > 0) {
                            hasImages = true;
                            imagesHTML = '<div class="record-images">';
                            images.forEach((img, index) => {
                                imagesHTML += `
                                    <div class="record-image" onclick="viewImage('${img.base64}', '${img.type}')">
                                        <img src="${img.base64}" alt="图片 ${index + 1}" />
                                        <div class="image-overlay">
                                            <span>查看</span>
                                        </div>
                                    </div>
                                `;
                            });
                            imagesHTML += '</div>';
                        }
                    } catch (e) {
                        console.error('解析图片数据失败:', e);
                    }
                }

                // 检查是否是纯图片内容
                const isPureImageContent = trimmedContent.startsWith('[图片内容]') && hasImages;
                
                // 调试信息
                debugHTML += `<div class="debug-info">
                    <strong>记录 ${record.id}:</strong><br>
                    内容: "${trimmedContent}"<br>
                    startsWith('[图片内容]'): ${trimmedContent.startsWith('[图片内容]')}<br>
                    hasImages: ${hasImages}<br>
                    images数组长度: ${images.length}<br>
                    isPureImageContent: ${isPureImageContent}<br>
                    应显示按钮: ${isPureImageContent ? '下载按钮' : '复制按钮'}
                </div>`;

                // 使用Base64编码内容
                const encodedContent = btoa(unescape(encodeURIComponent(trimmedContent)));

                // 构建内容区域
                let contentHTML = '';
                if (trimmedContent) {
                    contentHTML += trimmedContent;
                }
                if (hasImages) {
                    contentHTML += imagesHTML;
                }

                const imageCount = images.length;
                const actualLength = record.length || (trimmedContent.length + (imageCount * 50));

                recordsHTML += '<li class="record-item">' +
                    '<div class="record-content-wrapper">' +
                    '<div class="record-content" data-id="' + record.id + '">' +
                    contentHTML +
                    '</div>' +
                    '<div class="record-meta">' +
                    '<span class="meta-item">' +
                    '<img src="img/length.svg" class="meta-icon" width="14" height="14" title="长度">' +
                    actualLength +
                    '</span>' +
                    (hasImages ? 
                        '<span class="meta-item">' +
                        '<img src="img/image.svg" class="meta-icon" width="14" height="14" title="图片数量">' +
                        imageCount + '张图片' +
                        '</span>' : '') +
                    '<span class="meta-item">' +
                    '<img src="img/time.svg" class="meta-icon" width="14" height="14" title="时间">' +
                    record.timestamp.substring(5, 16) +
                    '</span>' +
                    '</div>' +
                    '</div>' +
                    '<div class="record-actions">' +
                    (isPureImageContent ? 
                        // 纯图片内容显示下载按钮
                        '<button class="download-btn" onclick="downloadRecordImages(' + record.id + ', \'' + 
                        btoa(unescape(encodeURIComponent(JSON.stringify(images)))) + '\')" title="下载图片">' +
                        '<img src="img/download.svg" class="icon download-icon">' +
                        '<span class="download-text">下载</span>' +
                        '</button>' :
                        // 普通内容显示复制按钮
                        '<button class="copy-btn" onclick="copyToClipboard(' + record.id + ', \'' + encodedContent +
                        '\')" title="复制">' +
                        '<img src="img/copy.svg" class="icon copy-icon">' +
                        '<span class="copy-text">复制</span>' +
                        '</button>'
                    ) +
                    '</div>' +
                    '</li>';
            });

            recordsHTML += '</ul>';
            container.innerHTML = recordsHTML;
            debugInfo.innerHTML = debugHTML;
        }

        // 模拟复制功能
        function copyToClipboard(id, encodedContent) {
            const content = decodeURIComponent(escape(atob(encodedContent)));
            console.log('复制内容:', content);
            alert('复制功能测试 - 记录ID: ' + id);
        }

        // 页面加载时渲染测试记录
        document.addEventListener('DOMContentLoaded', renderTestRecords);
    </script>
</body>
</html>
