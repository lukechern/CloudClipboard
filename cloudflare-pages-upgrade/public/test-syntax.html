<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>语法测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .status {
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .test-btn {
            background: #667eea;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
    </style>
</head>
<body>
    <h1>JavaScript 语法测试</h1>
    
    <div id="status"></div>
    
    <button class="test-btn" onclick="testClipboardHandler()">测试剪贴板处理器</button>
    <button class="test-btn" onclick="testMethods()">测试方法调用</button>
    
    <script src="js/clipboard.js"></script>
    <script>
        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.innerHTML = `<div class="status ${type}">${message}</div>`;
        }

        function testClipboardHandler() {
            try {
                if (window.clipboardHandler) {
                    showStatus('✅ clipboard.js 加载成功，没有语法错误', 'success');
                } else {
                    showStatus('❌ clipboardHandler 未定义', 'error');
                }
            } catch (error) {
                showStatus('❌ 语法错误: ' + error.message, 'error');
            }
        }

        function testMethods() {
            try {
                const handler = window.clipboardHandler;
                if (handler) {
                    // 测试方法是否存在
                    const methods = ['hasImages', 'getImagesData', 'clearAll', 'clearImages'];
                    const results = methods.map(method => {
                        return typeof handler[method] === 'function' ? `✅ ${method}` : `❌ ${method}`;
                    });
                    showStatus('方法测试结果:<br>' + results.join('<br>'), 'success');
                } else {
                    showStatus('❌ clipboardHandler 不存在', 'error');
                }
            } catch (error) {
                showStatus('❌ 方法测试失败: ' + error.message, 'error');
            }
        }

        // 页面加载时自动测试
        window.addEventListener('load', () => {
            setTimeout(() => {
                testClipboardHandler();
            }, 100);
        });
    </script>
</body>
</html>
