<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>下载按钮修复测试</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/records.css">
    <link rel="stylesheet" href="css/components.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
        }
        .test-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        .test-form {
            background: white;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #dee2e6;
            margin-bottom: 20px;
        }
        .test-form textarea {
            width: 100%;
            min-height: 100px;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            resize: vertical;
        }
        .test-form button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        .test-form button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <h1>下载按钮修复测试</h1>
    
    <div class="test-section">
        <h3>问题说明</h3>
        <p>主要问题：数据库表缺少 <code>images</code> 字段，导致前端无法正确识别图片内容，从而不显示下载按钮。</p>
        
        <h4>修复内容：</h4>
        <ul>
            <li>✅ 更新数据库表结构，添加 <code>images</code> 字段</li>
            <li>✅ 更新API代码，处理图片数据的保存和读取</li>
            <li>✅ 确保前端能正确识别纯图片内容并显示下载按钮</li>
        </ul>
    </div>

    <div class="test-section">
        <h3>测试步骤</h3>
        <ol>
            <li>首先需要升级数据库表结构（添加images字段）</li>
            <li>然后测试保存包含图片的记录</li>
            <li>检查历史记录中是否正确显示下载按钮</li>
        </ol>
        
        <button onclick="upgradeDatabase()" class="test-form button">1. 升级数据库表结构</button>
        <div id="upgrade-status"></div>
    </div>

    <div class="test-section">
        <h3>模拟图片内容测试</h3>
        <div class="test-form">
            <textarea id="test-content" placeholder="输入测试内容...">[图片内容] 1张图片</textarea>
            <button onclick="saveTestRecord()">2. 保存测试记录</button>
        </div>
        <div id="save-status"></div>
    </div>

    <div class="test-section">
        <h3>检查记录显示</h3>
        <button onclick="loadTestRecords()" class="test-form button">3. 加载记录并检查下载按钮</button>
        <div id="records-status"></div>
        <div id="test-records-container"></div>
    </div>

    <script src="js/content.js"></script>
    <script>
        function showStatus(elementId, message, type) {
            const element = document.getElementById(elementId);
            element.innerHTML = `<div class="status ${type}">${message}</div>`;
        }

        async function upgradeDatabase() {
            showStatus('upgrade-status', '正在升级数据库表结构...', 'info');
            
            try {
                const formData = new FormData();
                formData.append('action', 'upgrade');
                
                const response = await fetch('/api/init', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (response.ok && result.success) {
                    showStatus('upgrade-status', '✅ ' + result.message, 'success');
                } else {
                    showStatus('upgrade-status', '❌ 升级失败: ' + (result.error || '未知错误'), 'error');
                }
            } catch (error) {
                showStatus('upgrade-status', '❌ 升级失败: ' + error.message, 'error');
            }
        }

        async function saveTestRecord() {
            const content = document.getElementById('test-content').value.trim();
            if (!content) {
                showStatus('save-status', '❌ 请输入测试内容', 'error');
                return;
            }
            
            showStatus('save-status', '正在保存测试记录...', 'info');
            
            try {
                const formData = new FormData();
                formData.append('content', content);
                
                // 如果是图片内容，添加模拟图片数据
                if (content.includes('[图片内容]')) {
                    const mockImages = [{
                        base64: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==',
                        type: 'image/png'
                    }];
                    formData.append('images', JSON.stringify(mockImages));
                    formData.append('content_type', 'image');
                }
                
                const response = await fetch('/api/records', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (response.ok && result.success) {
                    showStatus('save-status', '✅ 测试记录保存成功，ID: ' + result.id, 'success');
                } else {
                    showStatus('save-status', '❌ 保存失败: ' + (result.error || '未知错误'), 'error');
                }
            } catch (error) {
                showStatus('save-status', '❌ 保存失败: ' + error.message, 'error');
            }
        }

        async function loadTestRecords() {
            showStatus('records-status', '正在加载记录...', 'info');
            
            try {
                const response = await fetch('/api/records?filter=cache');
                const records = await response.json();
                
                if (response.ok && Array.isArray(records)) {
                    showStatus('records-status', `✅ 成功加载 ${records.length} 条记录`, 'success');
                    
                    // 渲染记录，重点检查下载按钮
                    renderTestRecords(records);
                } else {
                    showStatus('records-status', '❌ 加载失败: ' + (records.error || '未知错误'), 'error');
                }
            } catch (error) {
                showStatus('records-status', '❌ 加载失败: ' + error.message, 'error');
            }
        }

        function renderTestRecords(records) {
            const container = document.getElementById('test-records-container');
            
            if (records.length === 0) {
                container.innerHTML = '<p>暂无记录</p>';
                return;
            }
            
            let html = '<h4>记录列表（重点检查下载按钮）：</h4><ul class="record-list">';
            
            records.slice(0, 5).forEach(record => { // 只显示前5条
                const trimmedContent = record.content ? record.content.trim() : '';
                
                // 处理图片数据
                let hasImages = false;
                let images = [];
                if (record.images) {
                    try {
                        images = typeof record.images === 'string' ? JSON.parse(record.images) : record.images;
                        hasImages = Array.isArray(images) && images.length > 0;
                    } catch (e) {
                        console.error('解析图片数据失败:', e);
                    }
                }
                
                // 检查是否是纯图片内容
                const isPureImageContent = trimmedContent.startsWith('[图片内容]') && hasImages;
                
                const buttonType = isPureImageContent ? '下载按钮 (绿色)' : '复制按钮 (白色)';
                const buttonClass = isPureImageContent ? 'download-btn' : 'copy-btn';
                const buttonIcon = isPureImageContent ? 'download.svg' : 'copy.svg';
                const buttonText = isPureImageContent ? '下载' : '复制';
                
                html += `
                    <li class="record-item">
                        <div class="record-content-wrapper">
                            <div class="record-content">
                                ${trimmedContent}
                                <div style="font-size: 12px; color: #666; margin-top: 5px;">
                                    📊 调试信息: hasImages=${hasImages}, isPureImageContent=${isPureImageContent}, 应显示=${buttonType}
                                </div>
                            </div>
                            <div class="record-meta">
                                <span class="meta-item">ID: ${record.id}</span>
                                ${hasImages ? `<span class="meta-item">🖼️ ${images.length}张图片</span>` : ''}
                            </div>
                        </div>
                        <div class="record-actions">
                            <button class="${buttonClass}" title="${buttonText}">
                                <img src="img/${buttonIcon}" class="icon">
                                <span>${buttonText}</span>
                            </button>
                        </div>
                    </li>
                `;
            });
            
            html += '</ul>';
            container.innerHTML = html;
        }

        // 页面加载时显示说明
        window.addEventListener('load', () => {
            showStatus('upgrade-status', '💡 请按顺序执行测试步骤', 'info');
        });
    </script>
</body>
</html>
