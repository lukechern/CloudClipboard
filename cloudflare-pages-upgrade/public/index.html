<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云剪贴板</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/form.css">
    <link rel="stylesheet" href="css/records.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/toolbar.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="icon" type="image/x-icon" href="/img/favicon.ico">
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>云剪贴板</h1>
            <p>跨设备同步您的文本内容</p>
        </div>

        <div class="content">
            <div class="input-section">
                <form id="content-form">
                    <div class="textarea-container">
                        <textarea id="content-input" name="content" placeholder="在此输入您要保存的文本内容..." required></textarea>
                        <button type="button" class="clear-btn" id="clearBtn" title="清空内容">
                            <img src="img/clear.svg" alt="清空" width="24" height="24">
                        </button>
                    </div>
                    <div class="image-preview-container" id="imagePreviewContainer" style="display: none;">
                        <div class="image-preview-header">
                            <span class="image-preview-title">图片预览</span>
                            <button type="button" class="remove-image-btn" id="removeImageBtn" title="清除图片">
                                <img src="img/clear.svg" alt="清除" width="16" height="16">
                                <span class="remove-btn-text">清除</span>
                            </button>
                        </div>
                        <div class="image-preview" id="imagePreview"></div>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="upload-btn-icon" id="uploadBtn" title="上传图片文件">
                            <img src="img/upload.svg" alt="上传图片" width="50" height="50">
                        </button>
                        <input type="file" id="fileInput" accept="image/*" multiple style="display: none;">
                        <button type="submit">发送到云端</button>
                    </div>
                </form>
            </div>

            <div class="records-section">
                <div class="records-header">
                    <h2>历史记录</h2>
                    <div class="header-actions">
                        <div class="tab-container">
                            <button class="tab-btn active" data-filter="cache">缓存</button>
                            <button class="tab-btn" data-filter="archived">存档</button>
                        </div>
                        <button class="refresh-btn" id="refreshRecords" title="刷新记录">
                            <img src="img/refresh.svg" class="icon" alt="刷新" width="16" height="16">
                        </button>
                    </div>
                </div>
                <div id="records-loading" class="records-loading" style="display: none;">
                    <img src="img/spinner.svg" class="spinner" alt="Loading">
                    <span>载入中...</span>
                </div>
                <div id="records-container">
                    <!-- 记录将通过JavaScript动态加载 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 存储位置信息 -->
    <div class="storage-info">
        <div id="storage-info-container">
            <!-- 存储信息将通过JavaScript动态加载 -->
        </div>
    </div>

    <div id="notification" class="notification">已复制到剪贴板</div>

    <!-- 确认对话框容器 -->
    <div id="modal-container"></div>

    <!-- 回到顶部按钮 -->
    <div class="back-to-top" id="backToTop" title="回到顶部"></div>

    <!-- 批量操作按钮 -->
    <div class="batch-operation" id="batchOperation" title="批量操作">
        <img src="img/operation.svg" alt="批量操作" width="24" height="24">
    </div>

    <script src="js/auth.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/clipboard.js"></script>
    <script src="js/content.js"></script>
    <script src="js/batch.js"></script>
    <script src="js/main.js"></script>
    <script src="js/mobile-fix.js"></script>


</body>

</html>
