<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>移动端优化测试</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/records.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/mobile-optimized.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            line-height: 1.6;
        }
        .test-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .device-info {
            background: #e7f3ff;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-family: monospace;
            font-size: 12px;
        }
        .demo-records {
            background: white;
            border: 1px solid #e1e5e9;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .toggle-btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        .toggle-btn:hover {
            background: #0056b3;
        }
        .toggle-btn.active {
            background: #28a745;
        }
    </style>
</head>
<body>
    <h1>移动端优化测试</h1>
    
    <div class="device-info" id="deviceInfo">
        <!-- 设备信息将通过JavaScript填充 -->
    </div>
    
    <div class="test-section">
        <h3>🚀 优化说明</h3>
        <p>针对安卓WebView中图片加载卡顿问题的优化措施：</p>
        <ul>
            <li><strong>图片懒加载：</strong>只在需要时加载图片，减少初始渲染负担</li>
            <li><strong>占位符显示：</strong>安卓WebView中使用轻量级占位符代替直接嵌入base64图片</li>
            <li><strong>点击加载：</strong>用户点击时才加载完整图片，避免一次性加载过多图片</li>
            <li><strong>数量限制：</strong>移动端限制同时显示的图片数量</li>
            <li><strong>性能优化：</strong>减少动画和GPU加速，降低内存占用</li>
        </ul>
    </div>

    <div class="test-section">
        <h3>🔧 渲染模式切换</h3>
        <p>测试不同的渲染模式：</p>
        <button class="toggle-btn" onclick="setRenderMode('original')">原始模式</button>
        <button class="toggle-btn active" onclick="setRenderMode('optimized')">优化模式</button>
        <button class="toggle-btn" onclick="setRenderMode('placeholder')">占位符模式</button>
    </div>

    <div class="demo-records">
        <h3>📱 模拟记录列表</h3>
        <div id="records-container">
            <!-- 记录将通过JavaScript动态生成 -->
        </div>
    </div>

    <div class="test-section">
        <h3>📊 性能对比</h3>
        <div id="performance-info">
            <p>点击上方按钮切换渲染模式，观察加载速度差异</p>
        </div>
    </div>

    <script src="js/content-mobile-optimized.js"></script>
    <script>
        let currentMode = 'optimized';
        
        // 显示设备信息
        function showDeviceInfo() {
            const info = document.getElementById('deviceInfo');
            const ua = navigator.userAgent;
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua);
            const isAndroid = ua.includes('Android');
            const isWebView = ua.includes('wv') || ua.includes('Version/');
            
            info.innerHTML = `
                <strong>设备检测结果：</strong><br>
                User Agent: ${ua}<br>
                是否移动设备: ${isMobile ? '是' : '否'}<br>
                是否安卓设备: ${isAndroid ? '是' : '否'}<br>
                是否WebView: ${isWebView ? '是' : '否'}<br>
                屏幕尺寸: ${window.innerWidth} x ${window.innerHeight}<br>
                设备像素比: ${window.devicePixelRatio || 1}
            `;
        }

        // 生成模拟数据
        function generateMockData() {
            const mockImage = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==';
            
            return [
                {
                    id: 1,
                    content: '[图片内容] 3张图片',
                    images: JSON.stringify([
                        { base64: mockImage, type: 'image/png', size: 1024 },
                        { base64: mockImage, type: 'image/png', size: 2048 },
                        { base64: mockImage, type: 'image/png', size: 1536 }
                    ]),
                    timestamp: '2024-12-25 14:30:00',
                    length: 120,
                    archived: 0
                },
                {
                    id: 2,
                    content: '这是一条包含文本和图片的混合记录',
                    images: JSON.stringify([
                        { base64: mockImage, type: 'image/png', size: 3072 },
                        { base64: mockImage, type: 'image/png', size: 2560 }
                    ]),
                    timestamp: '2024-12-25 14:25:00',
                    length: 85,
                    archived: 0
                },
                {
                    id: 3,
                    content: '[图片内容] 5张图片',
                    images: JSON.stringify([
                        { base64: mockImage, type: 'image/png', size: 1024 },
                        { base64: mockImage, type: 'image/png', size: 2048 },
                        { base64: mockImage, type: 'image/png', size: 1536 },
                        { base64: mockImage, type: 'image/png', size: 2560 },
                        { base64: mockImage, type: 'image/png', size: 3072 }
                    ]),
                    timestamp: '2024-12-25 14:20:00',
                    length: 150,
                    archived: 0
                },
                {
                    id: 4,
                    content: '普通文本记录，没有图片',
                    images: null,
                    timestamp: '2024-12-25 14:15:00',
                    length: 25,
                    archived: 0
                }
            ];
        }

        // 原始渲染模式
        function renderOriginal(data) {
            let html = '<ul class="record-list">';
            data.forEach(record => {
                const trimmedContent = record.content || '';
                let imagesHTML = '';
                
                if (record.images) {
                    try {
                        const images = JSON.parse(record.images);
                        if (Array.isArray(images) && images.length > 0) {
                            imagesHTML = '<div class="record-images">';
                            images.forEach((img, index) => {
                                imagesHTML += `
                                    <div class="record-image">
                                        <img src="${img.base64}" alt="图片 ${index + 1}" />
                                    </div>
                                `;
                            });
                            imagesHTML += '</div>';
                        }
                    } catch (e) {
                        console.error('解析图片失败:', e);
                    }
                }
                
                html += `
                    <li class="record-item">
                        <div class="record-content-wrapper">
                            <div class="record-content">
                                ${trimmedContent}
                                ${imagesHTML}
                            </div>
                            <div class="record-meta">
                                <span class="meta-item">ID: ${record.id}</span>
                                <span class="meta-item">${record.timestamp.substring(5, 16)}</span>
                            </div>
                        </div>
                    </li>
                `;
            });
            html += '</ul>';
            return html;
        }

        // 占位符渲染模式
        function renderPlaceholder(data) {
            let html = '<ul class="record-list">';
            data.forEach(record => {
                const trimmedContent = record.content || '';
                let imagesHTML = '';
                
                if (record.images) {
                    try {
                        const images = JSON.parse(record.images);
                        if (Array.isArray(images) && images.length > 0) {
                            imagesHTML = '<div class="record-images">';
                            images.forEach((img, index) => {
                                imagesHTML += window.imageLazyLoader.createImagePlaceholder(img, index);
                            });
                            imagesHTML += '</div>';
                        }
                    } catch (e) {
                        console.error('解析图片失败:', e);
                    }
                }
                
                html += `
                    <li class="record-item">
                        <div class="record-content-wrapper">
                            <div class="record-content">
                                ${trimmedContent}
                                ${imagesHTML}
                            </div>
                            <div class="record-meta">
                                <span class="meta-item">ID: ${record.id}</span>
                                <span class="meta-item">${record.timestamp.substring(5, 16)}</span>
                            </div>
                        </div>
                    </li>
                `;
            });
            html += '</ul>';
            return html;
        }

        // 设置渲染模式
        function setRenderMode(mode) {
            const startTime = performance.now();
            const container = document.getElementById('records-container');
            const data = generateMockData();
            
            // 更新按钮状态
            document.querySelectorAll('.toggle-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            currentMode = mode;
            
            switch (mode) {
                case 'original':
                    container.innerHTML = renderOriginal(data);
                    break;
                case 'optimized':
                    if (typeof window.renderRecordsOptimized === 'function') {
                        window.renderRecordsOptimized(data);
                    } else {
                        container.innerHTML = '<p>优化渲染器未加载</p>';
                    }
                    break;
                case 'placeholder':
                    container.innerHTML = renderPlaceholder(data);
                    break;
            }
            
            const endTime = performance.now();
            const renderTime = (endTime - startTime).toFixed(2);
            
            document.getElementById('performance-info').innerHTML = `
                <p><strong>当前模式：</strong>${mode}</p>
                <p><strong>渲染时间：</strong>${renderTime}ms</p>
                <p><strong>说明：</strong>${getModeDescription(mode)}</p>
            `;
        }

        function getModeDescription(mode) {
            switch (mode) {
                case 'original':
                    return '直接嵌入base64图片，可能导致安卓WebView卡顿';
                case 'optimized':
                    return '智能检测设备类型，自动选择最佳渲染方式';
                case 'placeholder':
                    return '使用占位符代替图片，点击时加载，适合安卓WebView';
                default:
                    return '';
            }
        }

        // 模拟图片查看功能
        window.viewImage = function(base64, type) {
            alert('图片查看功能（模拟）\n类型: ' + type + '\n大小: ' + Math.round(base64.length * 0.75) + ' bytes');
        };

        // 页面加载时初始化
        window.addEventListener('load', () => {
            showDeviceInfo();
            setRenderMode('optimized');
        });
    </script>
</body>
</html>
